name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Deploy via SCP to InstaWP Staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          source: ".,!.git,!.github,!OFO-Ad-Copy-Toolkit-2025.docx,!OFO-Brand-Positioning-2025.docx,!_PROJECT-PROMPT.md,!README.md,!.DS_Store"
