name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy files to server
        env:
          INSTAWP_SSH_PASSWORD: ${{ secrets.INSTAWP_SSH_PASSWORD }}
        run: |
          export SSHPASS="$INSTAWP_SSH_PASSWORD"
          HOST="caruyuloru8018@64.227.108.149"
          THEME="/var/www/html/wp-content/themes/bricks-child"
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -p 22"
          SCP="sshpass -e scp -o StrictHostKeyChecking=no -P 22"

          # Test connection
          $SSH $HOST "echo 'SSH OK'"

          # Create tar of all theme files
          tar czf /tmp/deploy.tar.gz functions.php style.css single-product.php custom-css/ custom-js/ includes/ templates/ woocommerce/

          # Upload tar
          $SCP /tmp/deploy.tar.gz "$HOST:/tmp/deploy.tar.gz"

          # Extract on server
          $SSH $HOST "cd $THEME && tar xzf /tmp/deploy.tar.gz && rm -f /tmp/deploy.tar.gz && echo 'Extract OK'"

          # Verify
          $SSH $HOST "grep -c findProduct $THEME/custom-js/pallet-builder.js && echo 'DEPLOY VERIFIED' || echo 'DEPLOY FAILED'"
