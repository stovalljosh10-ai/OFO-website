name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          script_stop: true
          debug: true
          script: |
            set -ex
            THEME="/var/www/html/wp-content/themes/bricks-child"
            which git || echo "GIT NOT INSTALLED"
            rm -rf /tmp/ofo-deploy
            git clone --branch dev --depth 1 https://github.com/stovalljosh10-ai/OFO-website.git /tmp/ofo-deploy
            ls -la /tmp/ofo-deploy/custom-js/pallet-builder.js
            grep -c findProduct /tmp/ofo-deploy/custom-js/pallet-builder.js
            cp -f /tmp/ofo-deploy/functions.php "$THEME/functions.php"
            cp -f /tmp/ofo-deploy/style.css "$THEME/style.css"
            rm -rf "$THEME/custom-css" "$THEME/custom-js" "$THEME/includes" "$THEME/templates" "$THEME/woocommerce"
            cp -rf /tmp/ofo-deploy/custom-css "$THEME/custom-css"
            cp -rf /tmp/ofo-deploy/custom-js "$THEME/custom-js"
            cp -rf /tmp/ofo-deploy/includes "$THEME/includes"
            cp -rf /tmp/ofo-deploy/templates "$THEME/templates"
            cp -rf /tmp/ofo-deploy/woocommerce "$THEME/woocommerce"
            grep -c findProduct "$THEME/custom-js/pallet-builder.js"
            rm -rf /tmp/ofo-deploy
            echo "DONE"
