name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to InstaWP Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          script: |
            THEME_DIR="/var/www/html/wp-content/themes/bricks-child"
            cd "$THEME_DIR"
            rm -rf temp-repo
            git clone --branch dev --single-branch https://github.com/stovalljosh10-ai/OFO-website.git temp-repo
            rsync -av --exclude='.git' temp-repo/ "$THEME_DIR/"
            rm -rf temp-repo
            echo "Deploy complete: $(date)"
