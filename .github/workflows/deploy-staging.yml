name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy files via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          script: |
            THEME="/var/www/html/wp-content/themes/bricks-child"
            REPO="https://raw.githubusercontent.com/stovalljosh10-ai/OFO-website/dev"
            cd "$THEME"
            curl -sL "$REPO/functions.php" -o functions.php
            curl -sL "$REPO/style.css" -o style.css
            curl -sL "$REPO/single-product.php" -o single-product.php
            mkdir -p custom-css custom-js includes templates woocommerce
            for f in announcement-bar.css countdown.css hero.css pallet-builder.css woocommerce-overrides.css ofo-overrides.css; do
              curl -sL "$REPO/custom-css/$f" -o "custom-css/$f" 2>/dev/null
            done
            for f in announcement-bar.js countdown.js pallet-builder.js ofo-main.js; do
              curl -sL "$REPO/custom-js/$f" -o "custom-js/$f" 2>/dev/null
            done
            for f in header-main.php footer-main.php homepage-slider.php homepage-recproducts.php homepage-content.php homepage-review.php loyalty-floating-button.php loyalty-rewards-content.php setup-hero.php setup-pallet-page.php; do
              curl -sL "$REPO/includes/$f" -o "includes/$f" 2>/dev/null
            done
            curl -sL "$REPO/templates/pallet-builder.php" -o "templates/pallet-builder.php"
            curl -sL "$REPO/woocommerce/archive-product.php" -o "woocommerce/archive-product.php"
            echo "=== VERIFY ==="
            grep -c "findProduct" custom-js/pallet-builder.js && echo "NEW FILE OK" || echo "OLD FILE STILL"
            echo "Deploy complete: $(date)"
