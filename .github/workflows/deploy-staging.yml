name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy archive
        run: |
          tar czf deploy.tar.gz functions.php style.css single-product.php custom-css/ custom-js/ includes/ templates/ woocommerce/
          ls -la deploy.tar.gz

      - name: Copy archive to server
        uses: cross-the-world/ssh-scp-ssh-pipelines@latest
        with:
          host: 64.227.108.149
          user: caruyuloru8018
          pass: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          scp: |
            './deploy.tar.gz' => '/tmp/deploy.tar.gz'

      - name: Extract on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          script: |
            cd /var/www/html/wp-content/themes/bricks-child
            tar xzf /tmp/deploy.tar.gz
            rm -f /tmp/deploy.tar.gz
            grep -c findProduct custom-js/pallet-builder.js && echo "DEPLOY OK" || echo "DEPLOY FAILED"
            echo "Deploy complete: $(date)"
