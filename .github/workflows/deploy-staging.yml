name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "Connection OK"

      - name: Transfer files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          source: "functions.php,style.css,single-product.php,custom-css/*,custom-js/*,includes/*,templates/*,woocommerce/*"
          target: /var/www/html/wp-content/themes/bricks-child/

      - name: Verify deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          script: |
            grep -c "findProduct" /var/www/html/wp-content/themes/bricks-child/custom-js/pallet-builder.js && echo "DEPLOY OK" || echo "DEPLOY FAILED"
