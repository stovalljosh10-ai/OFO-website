name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via tar over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 64.227.108.149
          username: caruyuloru8018
          password: ${{ secrets.INSTAWP_SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "Connected"

      - name: Create and transfer archive
        run: |
          # Create archive
          tar czf deploy.tar.gz functions.php style.css single-product.php custom-css/ custom-js/ includes/ templates/ woocommerce/

          # Install sshpass
          sudo apt-get install -y -qq sshpass 2>/dev/null

          # Upload and extract
          export SSHPASS="${{ secrets.INSTAWP_SSH_PASSWORD }}"
          sshpass -e scp -o StrictHostKeyChecking=no -P 22 deploy.tar.gz caruyuloru8018@64.227.108.149:/tmp/deploy.tar.gz
          sshpass -e ssh -o StrictHostKeyChecking=no -p 22 caruyuloru8018@64.227.108.149 "cd /var/www/html/wp-content/themes/bricks-child && tar xzf /tmp/deploy.tar.gz && rm /tmp/deploy.tar.gz && grep -c findProduct custom-js/pallet-builder.js && echo DEPLOY_OK || echo DEPLOY_FAILED"
